<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КИТ · Редактор инструкций</title>
<style>
  :root { --bg: #F4F7F6; --paper: #FBFDFC; --ink: #1B2A2E; --muted: #5A6E72; --line: #D9E2E1; --accent: #0E6E63; --accent-dark: #0B4A43; --accent-soft: #E3F0ED; --danger: #B3552F; --warn: #FFF3CD; --top: 54px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; overflow: hidden; }
  button, input, textarea, select { font-family: inherit; font-size: 14px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* верхняя панель */
  header { position: fixed; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 20; }
  .brand { display: flex; flex-direction: column; line-height: 1.1; margin-right: 10px; }
  .brand .eyebrow { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); }
  .brand .name { font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 700; white-space: nowrap; }
  #ptitle { border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; font-size: 15px; font-weight: 600; background: transparent; min-width: 200px; max-width: 420px; flex: 1; }
  #ptitle:hover, #ptitle:focus { border-color: var(--line); background: #fff; outline: none; }
  .spacer { flex: 1; }
  .btn { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 9px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); color: #fff; } .btn.primary:hover { background: var(--accent-dark); }
  .btn.quiet { border-color: var(--line); color: var(--muted); } .btn.quiet:hover { background: #fff; color: var(--ink); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.sm { padding: 4px 9px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: .4; cursor: default; }
  /* три панели */
  main { position: fixed; top: var(--top); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 300px 1fr 280px; }
  .panel { overflow: auto; background: var(--paper); }
  .panel h2 { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .n { color: var(--muted); font-weight: 400; }
  .panel h2 .spacer { flex: 1; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  #center { background: var(--bg); padding: 18px 26px 40px; }
  /* дерево */
  .tree { padding: 0 8px 12px; }
  .node { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; cursor: pointer; user-select: none; position: relative; }
  .node:hover { background: #EEF3F2; }
  .node.sel { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .node.dropover { outline: 2px dashed var(--accent); }
  .node .num { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); min-width: 30px; }
  .node .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .cnt { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  .node .w { color: var(--danger); font-size: 12px; }
  .node.step .t { font-weight: 400; } .node.step.sel .t { font-weight: 600; }
  .node.d1 { margin-left: 16px; } .node.d2 { margin-left: 32px; } .node.d3 { margin-left: 48px; }
  .tree .empty { color: var(--muted); padding: 10px 14px; line-height: 1.5; font-size: 13px; }
  .treebar { display: flex; gap: 6px; padding: 6px 12px 10px; flex-wrap: wrap; }
  /* редактор шага */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .field input[type=text], .field textarea, .field select { width: 100%; border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 11px; background: #fff; color: var(--ink); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 200px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .hintline { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
  .strip { display: flex; gap: 10px; flex-wrap: wrap; min-height: 90px; padding: 10px; border: 1.5px dashed var(--line); border-radius: 10px; background: #fff; }
  .strip.dropover { border-color: var(--accent); background: var(--accent-soft); }
  .strip .ph { color: var(--muted); font-size: 13px; align-self: center; padding: 8px; }
  .thumb { position: relative; width: 132px; border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; cursor: grab; user-select: none; }
  .thumb img { display: block; width: 100%; height: 92px; object-fit: cover; pointer-events: none; }
  .thumb .cap { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--muted); padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: none; background: rgba(27,42,46,.75); color: #fff; font-size: 13px; line-height: 22px; cursor: pointer; display: none; padding: 0; }
  .thumb:hover .x { display: block; }
  .thumb.sel { outline: 2.5px solid var(--accent); }
  .thumb.dragging { opacity: .4; }
  .thumb .badge { position: absolute; left: 4px; top: 4px; background: rgba(27,42,46,.75); color: #fff; font-size: 10px; border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, monospace; }
  .pool { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 12px 14px; }
  .pool .thumb { width: auto; } .pool .thumb img { height: 76px; }
  .poolbar { display: flex; gap: 6px; padding: 0 12px 10px; flex-wrap: wrap; align-items: center; }
  .empty-center { color: var(--muted); text-align: center; padding: 60px 20px; line-height: 1.6; }
  .empty-center b { color: var(--ink); }
  .kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  /* меню, диалоги, уведомления */
  #menu { position: fixed; z-index: 40; min-width: 240px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(27,42,46,.18); padding: 6px; display: none; }
  #menu.show { display: block; }
  #menu .mi { display: flex; justify-content: space-between; gap: 14px; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 14px; }
  #menu .mi:hover { background: var(--accent-soft); } #menu .mi.danger { color: var(--danger); } #menu .mi.disabled { opacity: .4; pointer-events: none; }
  #menu .mi .k { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  #menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  #menu .mh { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); padding: 8px 12px 4px; }
  #dlg { position: fixed; inset: 0; z-index: 50; background: rgba(27,42,46,.35); display: none; align-items: center; justify-content: center; padding: 20px; }
  #dlg.show { display: flex; }
  #dlg .box { background: var(--paper); border-radius: 14px; padding: 22px 24px; width: min(480px, 100%); box-shadow: 0 20px 50px rgba(27,42,46,.25); }
  #dlg h3 { font-family: Georgia, serif; font-size: 20px; margin: 0 0 8px; }
  #dlg p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; white-space: pre-line; }
  #dlg input[type=text], #dlg select { width: 100%; border: 1.5px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 15px; margin-bottom: 14px; background: #fff; }
  #dlg .row { justify-content: flex-end; }
  #status { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 60; background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 16px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
  #status.show { opacity: 1; } #status.err { background: var(--danger); }
  /* предпросмотр */
  #preview { position: fixed; inset: 0; z-index: 45; background: rgba(27,42,46,.72); display: none; flex-direction: column; }
  #preview.show { display: flex; }
  #preview .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  #preview .bar .t { font-weight: 600; margin-right: 8px; }
  #preview .stage { flex: 1; display: flex; justify-content: center; padding: 16px; overflow: hidden; }
  #preview iframe { border: none; background: #fff; width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.3); transition: width .2s; }
  #preview.mobile iframe { width: 390px; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .seg button.on { background: var(--accent); color: #fff; }
  input[type=file] { display: none; }
  #start { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
  #start.show { display: flex; }
  #start .box { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 30px 34px; width: min(640px, 100%); box-shadow: 0 20px 60px rgba(27,42,46,.15); }
  #start h1 { font-family: Georgia, serif; font-size: 26px; margin: 0 0 6px; }
  #start p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
  #start .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  #start .recent { border-top: 1px solid var(--line); padding-top: 12px; }
  #start .recent h4 { margin: 0 0 8px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  #start .recent a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
  #start .recent a:hover { background: var(--accent-soft); }
  #start .recent .none { color: var(--muted); font-size: 13px; }
  #pdir { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #pdir:empty { display: none; }
  body.dropping::after { content: "Отпустите — файлы будут добавлены в пул изображений"; position: fixed; inset: 8px; border: 3px dashed var(--accent); border-radius: 14px; background: rgba(227,240,237,.85); z-index: 100; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: var(--accent-dark); pointer-events: none; }
  @media (max-width: 1000px) { main { grid-template-columns: 240px 1fr 220px; } .pool { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="eyebrow">КИТ · инструмент</span><span class="name">Редактор инструкций</span></div>
  <input id="ptitle" type="text" placeholder="Название инструкции" title="Название инструкции">
  <span id="pdir" title="Открыть папку проекта"></span>
  <div class="spacer"></div>
  <button class="btn quiet sm" id="bUndo" title="Отменить (Ctrl+Z)">↶</button>
  <button class="btn quiet sm" id="bRedo" title="Повторить (Ctrl+Shift+Z)">↷</button>
  <button class="btn primary" id="bImport">+ Изображения</button>
  <button class="btn" id="bPreview">Предпросмотр</button>
  <button class="btn" id="bBuild">Собрать ▾</button>
  <button class="btn quiet" id="bProject">Проект ▾</button>
</header>

<main>
  <section class="panel" id="left">
    <h2>Структура <span class="n" id="treeCount"></span><span class="spacer"></span></h2>
    <div class="treebar">
      <button class="btn sm" id="bAddSection">+ Раздел</button>
      <button class="btn sm quiet" id="bAddStep" title="Добавить шаг в выбранный раздел">+ Шаг</button>
    </div>
    <div class="tree" id="tree"></div>
  </section>

  <section class="panel" id="center"></section>

  <section class="panel" id="right">
    <h2>Пул изображений <span class="n" id="poolCount"></span></h2>
    <div class="poolbar">
      <button class="btn sm quiet" id="bSelAll">Выбрать все</button>
      <button class="btn sm" id="bAssign" disabled>В выбранный шаг</button>
      <button class="btn sm quiet" id="bAutoSplit" title="Создать по шагу на каждое изображение пула в выбранном разделе">Шаг на каждое</button>
    </div>
    <div class="pool" id="pool"></div>
  </section>
</main>

<div id="preview">
  <div class="bar">
    <span class="t">Предпросмотр</span>
    <div class="seg"><button id="pvDesk" class="on">Компьютер</button><button id="pvMob">Телефон</button></div>
    <button class="btn sm quiet" id="pvRefresh">Обновить</button>
    <div class="spacer"></div>
    <button class="btn sm quiet" id="pvClose">Закрыть</button>
  </div>
  <div class="stage"><iframe id="pvFrame" title="Предпросмотр инструкции"></iframe></div>
</div>

<div id="start"><div class="box">
  <h1>Редактор инструкций</h1>
  <p>Проект хранится в папке на диске: <span class="mono">project.json</span>, <span class="mono">images/</span>, <span class="mono">thumbs/</span>. Все изменения сохраняются в неё автоматически.</p>
  <div class="actions"><button class="btn primary" id="stNew">Создать проект…</button><button class="btn" id="stOpen">Открыть проект…</button><button class="btn quiet" id="stZip">Импорт из .instr.zip…</button></div>
  <div class="recent"><h4>Недавние проекты</h4><div id="stRecent"><span class="none">Пока нет</span></div></div>
</div></div>
<div id="menu"></div>
<div id="status"></div>
<div id="dlg"><div class="box"><h3 id="dlgTitle"></h3><p id="dlgText"></p><input type="text" id="dlgInput" autocomplete="off"><select id="dlgSelect"></select><div class="row"><button class="btn quiet" id="dlgCancel">Отмена</button><button class="btn primary" id="dlgOk">Готово</button></div></div></div>

<input type="file" id="fileImages" multiple accept="image/*">
<input type="file" id="fileFolder" multiple webkitdirectory directory>
<input type="file" id="fileReplace" accept="image/*">
<input type="file" id="fileProject" accept=".zip,application/zip,application/json,.json">

<script>
"use strict";
/* =====================================================================
   КИТ · Редактор инструкций. Один файл, без сервера и без сети.
   Проект → разделы → подразделы → шаги (изображения + текст). Сборка
   автономного сайта (index.html + assets, hash-маршрутизация) или одного файла.
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const natural = new Intl.Collator("ru", { numeric: true, sensitivity: "base" });

// ---------- модель ----------
let P = null;                 // { version, title, nodes:[], pool:[imgId], selected }
const IMG = new Map();        // id -> { blob, thumbUrl, url, w, h, name, hash, size }
let selId = null;             // выбранный узел
let poolSel = new Set();      // выбранные в пуле
const history = { undo: [], redo: [] };

function newProject() { return { version: 1, title: "Инструкция по сборке", nodes: [], pool: [], images: {} }; }
function node(type, title) { const n = { id: uid(), type, title: title || (type === "section" ? "Новый раздел" : "Новый шаг"), slug: "", text: "", warning: false, images: [], children: [] }; n.slug = slugify(n.title, n.id); return n; }
function walk(nodes, fn, depth = 0, parent = null) { for (const n of nodes) { fn(n, depth, parent); if (n.children.length) walk(n.children, fn, depth + 1, n); } }
function flat() { const out = []; walk(P.nodes, (n, d, p) => out.push({ n, d, p })); return out; }
function find(id) { let r = null; walk(P.nodes, n => { if (n.id === id) r = n; }); return r; }
function parentOf(id) { let r = null; walk(P.nodes, (n, d, p) => { if (n.id === id) r = p; }); return r; }
function siblings(id) { const p = parentOf(id); return p ? p.children : P.nodes; }
function depthOf(id) { let r = 0; walk(P.nodes, (n, d) => { if (n.id === id) r = d; }); return r; }
function steps() { return flat().filter(x => x.n.type === "step").map(x => x.n); }
function usedImages() { const s = new Set(); walk(P.nodes, n => n.images.forEach(i => s.add(i))); return s; }
const TR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya" };
function slugify(title, id) {
  let s = String(title || "").toLowerCase().split("").map(ch => TR[ch] ?? ch).join("").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48);
  if (!s) s = "razdel";
  const taken = new Set(); walk(P ? P.nodes : [], n => { if (n.id !== id) taken.add(n.slug); });
  let out = s, k = 2; while (taken.has(out)) out = s + "-" + (k++); return out;
}
function numbering() { // «1», «1.2», «1.2.3»
  const map = {}; const rec = (nodes, prefix) => nodes.forEach((n, i) => { const num = prefix ? prefix + "." + (i + 1) : String(i + 1); map[n.id] = num; rec(n.children, num); }); rec(P.nodes, ""); return map;
}

// ---------- хранилище: папка проекта (десктоп) или IndexedDB (браузер) ----------
const DESKTOP = !!window.desktop; let projectDir = null;
const MIME = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", gif: "image/gif", bmp: "image/bmp", svg: "image/svg+xml" };
function extOf(blob, name) { const t = ((blob && blob.type) || "").split("/")[1] || ""; const e = t.replace("jpeg", "jpg").replace("svg+xml", "svg") || (String(name || "").match(/\.([a-z0-9]+)$/i) || [])[1] || "bin"; return e.toLowerCase(); }
// rec: { blob, thumb, name, w, h, hash, size } → в IMG кладём { name, w, h, hash, size, ext, url, thumbUrl, blob?, thumb? }
async function storePut(id, rec) {
  const ext = extOf(rec.blob, rec.name); const meta = { name: rec.name, w: rec.w, h: rec.h, hash: rec.hash, size: rec.size, ext };
  const old = IMG.get(id); if (old && !DESKTOP) { URL.revokeObjectURL(old.url); URL.revokeObjectURL(old.thumbUrl); }
  let out;
  if (DESKTOP) { await desktop.writeImage(id, ext, new Uint8Array(await rec.blob.arrayBuffer())); await desktop.writeThumb(id, new Uint8Array(await rec.thumb.arrayBuffer())); out = { ...meta, id, url: `instr://img/${id}.${ext}?v=${rec.hash.slice(0, 8)}`, thumbUrl: `instr://thumb/${id}.jpg?v=${rec.hash.slice(0, 8)}` }; }
  else { await imgPut(id, { blob: rec.blob, thumb: rec.thumb, ...meta }); out = { ...meta, id, blob: rec.blob, thumb: rec.thumb, url: URL.createObjectURL(rec.blob), thumbUrl: URL.createObjectURL(rec.thumb) }; }
  IMG.set(id, out); (P.images ||= {})[id] = meta; return out;
}
async function storeDel(id) { const r = IMG.get(id); if (!r) return; if (DESKTOP) await desktop.deleteImage(id, r.ext).catch(() => {}); else { URL.revokeObjectURL(r.url); URL.revokeObjectURL(r.thumbUrl); await imgDel(id).catch(() => {}); } IMG.delete(id); if (P.images) delete P.images[id]; }
async function getBlob(rec) { if (rec.blob) return rec.blob; const bytes = await desktop.readImage(rec.id, rec.ext); return new Blob([bytes], { type: MIME[rec.ext] || "application/octet-stream" }); }
function attachWeb(id, rec) { const ext = rec.ext || extOf(rec.blob, rec.name); IMG.set(id, { ...rec, id, ext, url: URL.createObjectURL(rec.blob), thumbUrl: URL.createObjectURL(rec.thumb) }); }

// ---------- IndexedDB (браузерный режим) ----------
const DB_NAME = "kit_instrukcii", DB_VER = 1; let dbp = null;
function openDB() { return dbp ||= new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, DB_VER); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); if (!d.objectStoreNames.contains("images")) d.createObjectStore("images"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function tx(store, mode, fn) { const d = await openDB(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const r = fn(t.objectStore(t.objectStoreNames[0])); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); }
const kvGet = (k) => tx("kv", "readonly", s => s.get(k));
const kvSet = (k, v) => tx("kv", "readwrite", s => s.put(v, k));
const imgPut = (id, rec) => tx("images", "readwrite", s => s.put(rec, id));
const imgDel = (id) => tx("images", "readwrite", s => s.delete(id));
async function imgAll() { const d = await openDB(); return new Promise((res, rej) => { const out = new Map(); const c = d.transaction("images").objectStore("images").openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.set(cur.key, cur.value); cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }); }
async function dbClear() { const d = await openDB(); return new Promise((res, rej) => { const t = d.transaction(["kv", "images"], "readwrite"); t.objectStore("kv").clear(); t.objectStore("images").clear(); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
let saveTimer = null;
function flush() { clearTimeout(saveTimer); saveTimer = null; if (DESKTOP) { if (!projectDir) return Promise.resolve(); return desktop.writeProject(JSON.stringify({ app: "kit-instrukcii", version: 1, saved: new Date().toISOString(), title: P.title, nodes: P.nodes, pool: P.pool, images: P.images || {} }, null, 2)).catch(e => toast("Не удалось сохранить project.json: " + e.message, true)); } return kvSet("project", P).catch(e => toast("Не удалось сохранить: " + e.message, true)); }
function save(now) { if (now) return flush(); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
addEventListener("pagehide", () => { if (saveTimer) flush(); });

// ---------- история (отмена/повтор) структуры ----------
function snapshot() { return JSON.stringify({ title: P.title, nodes: P.nodes, pool: P.pool }); }
let lastSnap = null; // состояние после последнего зафиксированного изменения
function commit() { const cur = snapshot(); if (lastSnap !== null && cur !== lastSnap) { history.undo.push(lastSnap); if (history.undo.length > 60) history.undo.shift(); history.redo.length = 0; } lastSnap = cur; updateHistoryButtons(); }
function restore(s) { const o = JSON.parse(s); P.title = o.title; P.nodes = o.nodes; P.pool = o.pool; lastSnap = s; if (selId && !find(selId)) selId = null; renderAll(); save(true); }
function undo() { if (!history.undo.length) return; history.redo.push(snapshot()); restore(history.undo.pop()); updateHistoryButtons(); toast("Отменено"); }
function redo() { if (!history.redo.length) return; history.undo.push(snapshot()); restore(history.redo.pop()); updateHistoryButtons(); }
function updateHistoryButtons() { $("bUndo").disabled = !history.undo.length; $("bRedo").disabled = !history.redo.length; }

// ---------- изображения ----------
async function sha256(buf) { const h = await crypto.subtle.digest("SHA-256", buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
function decode(blob) { return new Promise((res, rej) => { const url = URL.createObjectURL(blob); const im = new Image(); im.onload = () => res({ im, url }); im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("файл не читается как изображение")); }; im.src = url; }); }
async function makeThumb(im, max = 320) { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k)); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return new Promise(r => c.toBlob(r, "image/jpeg", 0.82)); }
async function importFiles(fileList) {
  const files = Array.from(fileList || []).filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name));
  if (!files.length) { toast("Среди файлов нет изображений", true); return; }
  files.sort((a, b) => natural.compare(a.name, b.name)); // натуральная сортировка: 2 < 10
  const hashes = new Set([...IMG.values()].map(r => r.hash)); let added = 0, dup = 0, broken = 0;
  toast(`Импорт: ${files.length} файлов…`);
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer(); const hash = await sha256(buf);
      if (hashes.has(hash)) { dup++; continue; }
      const { im, url } = await decode(f); URL.revokeObjectURL(url);
      const thumb = await makeThumb(im); const id = uid();
      const rec = { blob: f, thumb, w: im.naturalWidth, h: im.naturalHeight, name: f.name, hash, size: f.size };
      await storePut(id, rec); P.pool.push(id); hashes.add(hash); added++;
    } catch (e) { broken++; }
  }
  const parts = [`Добавлено: ${added}`]; if (dup) parts.push(`дубликатов пропущено: ${dup}`); if (broken) parts.push(`не читаются: ${broken}`);
  toast(parts.join(" · "), broken > 0); commit(); renderPool(); renderTree(); save(true);
}
$("fileImages").addEventListener("change", e => { importFiles(e.target.files); e.target.value = ""; });
$("bImport").addEventListener("click", e => { const r = e.target.getBoundingClientRect(); openMenu(r.left, r.bottom + 6, [
  { h: "Импорт изображений" },
  { t: "Выбрать файлы…", f: () => $("fileImages").click() },
  { t: "Выбрать папку целиком…", f: () => $("fileFolder").click() },
  { t: "Перетащить файлы или папку в окно", disabled: true, f: () => {} },
]); });
$("fileFolder").addEventListener("change", e => { importFiles(e.target.files); e.target.value = ""; });
// перетащенная папка: обходим её рекурсивно
async function filesFromDataTransfer(dt) {
  const items = Array.from(dt.items || []); const entries = items.map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null);
  if (!entries.some(Boolean)) return Array.from(dt.files || []);
  const out = [];
  const readDir = (dir) => new Promise(res => { const rd = dir.createReader(); const all = []; const step = () => rd.readEntries(es => { if (!es.length) return res(all); all.push(...es); step(); }, () => res(all)); step(); });
  const fileOf = (fe) => new Promise(res => fe.file(res, () => res(null)));
  const visit = async (en) => { if (!en) return; if (en.isFile) { const f = await fileOf(en); if (f) out.push(f); } else if (en.isDirectory) { for (const ch of await readDir(en)) await visit(ch); } };
  for (let i = 0; i < entries.length; i++) { if (entries[i]) await visit(entries[i]); else if (dt.files[i]) out.push(dt.files[i]); }
  return out;
}
document.addEventListener("dragover", e => { if (e.dataTransfer?.types?.includes("Files")) { e.preventDefault(); document.body.classList.add("dropping"); } });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
document.addEventListener("drop", async e => { document.body.classList.remove("dropping"); if (e.dataTransfer?.files?.length) { e.preventDefault(); if (!e.target.closest(".strip, .node")) importFiles(await filesFromDataTransfer(e.dataTransfer)); } });
async function gcImages() { const used = usedImages(); for (const id of [...IMG.keys()]) if (!used.has(id) && !P.pool.includes(id)) await storeDel(id); }

// ---------- дерево ----------
function renderTree() {
  const t = $("tree"); t.innerHTML = ""; const num = numbering(); let total = 0;
  if (!P.nodes.length) t.innerHTML = `<div class="empty">Структуры пока нет. Нажмите «+ Раздел», затем «+ Шаг», и перетащите изображения из пула на шаг.</div>`;
  walk(P.nodes, (n, d) => {
    total++;
    const el = document.createElement("div"); el.className = `node d${d} ${n.type}` + (n.id === selId ? " sel" : ""); el.dataset.id = n.id;
    el.innerHTML = `<span class="num">${esc(num[n.id])}</span><span class="t"></span>${n.warning ? '<span class="w" title="Важное предупреждение">▲</span>' : ""}<span class="cnt">${n.images.length ? n.images.length + " ф." : ""}</span>`;
    el.querySelector(".t").textContent = n.title;
    el.addEventListener("click", () => selectNode(n.id));
    el.addEventListener("dblclick", () => renameNode(n.id));
    el.addEventListener("contextmenu", e => { e.preventDefault(); selectNode(n.id); openMenu(e.clientX, e.clientY, nodeMenu(n.id)); });
    el.addEventListener("dragover", e => { if (dragImgs.length) { e.preventDefault(); el.classList.add("dropover"); } });
    el.addEventListener("dragleave", () => el.classList.remove("dropover"));
    el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("dropover"); if (dragImgs.length) { assignImages(n.id, dragImgs); dragImgs = []; } });
    t.appendChild(el);
  });
  $("treeCount").textContent = total ? `· ${P.nodes.length} разд. · ${steps().length} шагов` : "";
  $("bAddStep").disabled = !selId;
}
function selectNode(id) { selId = id; renderTree(); renderCenter(); $("bAssign").disabled = !(selId && poolSel.size); }
function topAncestor(id) { let n = find(id); let p; while (n && (p = parentOf(n.id))) n = p; return n; }
function addSection() { const n = node("section"); const top = selId ? topAncestor(selId) : null; const i = top ? P.nodes.indexOf(top) : -1;
  P.nodes.splice(i >= 0 ? i + 1 : P.nodes.length, 0, n); commit(); selectNode(n.id); save(true); renameNode(n.id); }
function addStep(parentId) { let p = parentId ? find(parentId) : (selId ? find(selId) : null); if (p && p.type === "step") p = parentOf(p.id);
  if (!p) { if (!P.nodes.length) { P.nodes.push(node("section", "Раздел 1")); } p = P.nodes[P.nodes.length - 1]; }
  const n = node("step", "Шаг " + (p.children.filter(c => c.type === "step").length + 1)); p.children.push(n); commit(); selectNode(n.id); save(true); return n; }
async function renameNode(id) { const n = find(id); const v = await ask("Название", n.type === "section" ? "Раздел" : "Шаг", n.title); if (v == null) return; n.title = v.trim() || n.title; if (!n.slugManual) n.slug = slugify(n.title, n.id); commit(); renderAll(); save(true); }
async function deleteNode(id) { const n = find(id); const cnt = flat().filter(x => x.n === n || isDescendant(n, x.n)).length; const imgs = []; walk([n], k => imgs.push(...k.images));
  if ((cnt > 1 || imgs.length) && !await confirmDlg("Удалить?", `«${n.title}»: ${cnt} узлов, ${imgs.length} изображений. Изображения вернутся в пул.`)) return;
  const arr = siblings(id); arr.splice(arr.indexOf(n), 1); P.pool.push(...imgs); if (selId === id) selId = null; commit(); renderAll(); save(true); }
function isDescendant(root, n) { let r = false; walk(root.children, k => { if (k === n) r = true; }); return r; }
function moveNode(id, dir) { const arr = siblings(id); const i = arr.findIndex(n => n.id === id); const j = i + dir; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; commit(); renderAll(); save(true); }
function indentNode(id) { const arr = siblings(id); const i = arr.findIndex(n => n.id === id); if (i === 0) return; const prev = arr[i - 1]; if (prev.type !== "section") { toast("Вложить можно только в раздел", true); return; }
  const n = arr[i]; if (n.type === "section" && depthOf(prev.id) >= 1) { toast("Максимум два уровня разделов", true); return; }
  if (n.type === "section" && n.children.some(c => c.type === "section")) { toast("Раздел с подразделами нельзя вложить глубже", true); return; }
  arr.splice(i, 1); prev.children.push(n); commit(); renderAll(); save(true); }
function outdentNode(id) { const p = parentOf(id); if (!p) return; const gp = parentOf(p.id); const arr = gp ? gp.children : P.nodes; const n = find(id); if (n.type === "step" && !gp) { toast("Шаг должен быть внутри раздела", true); return; }
  p.children.splice(p.children.indexOf(n), 1); arr.splice(arr.indexOf(p) + 1, 0, n); commit(); renderAll(); save(true); }
function nodeMenu(id) {
  const n = find(id); const arr = siblings(id); const i = arr.indexOf(n);
  return [
    { h: n.type === "section" ? "Раздел " + numbering()[id] : "Шаг " + numbering()[id] },
    { t: "Переименовать", k: "F2", f: () => renameNode(id) },
    n.type === "section" ? { t: "Добавить шаг внутрь", f: () => addStep(id) } : null,
    n.type === "section" && depthOf(id) === 0 ? { t: "Добавить подраздел", f: () => { const s = node("section", "Подраздел"); n.children.push(s); commit(); selectNode(s.id); save(true); renameNode(s.id); } } : null,
    { t: "Дублировать", f: () => { const d = JSON.parse(JSON.stringify(n)); walk([d], k => { k.id = uid(); k.slug = slugify(k.title + " копия", k.id); }); d.title += " (копия)"; d.images = []; walk(d.children, k => k.images = []); arr.splice(i + 1, 0, d); commit(); renderAll(); save(true); } },
    "-",
    { t: "Выше", k: "Alt+↑", disabled: i === 0, f: () => moveNode(id, -1) },
    { t: "Ниже", k: "Alt+↓", disabled: i === arr.length - 1, f: () => moveNode(id, 1) },
    { t: "Вложить в предыдущий раздел", k: "Alt+→", disabled: i === 0, f: () => indentNode(id) },
    { t: "Вынести на уровень выше", k: "Alt+←", disabled: !parentOf(id), f: () => outdentNode(id) },
    "-",
    { t: "Удалить", k: "⌫", danger: true, f: () => deleteNode(id) },
  ].filter(Boolean);
}
$("bAddSection").addEventListener("click", addSection);
$("bAddStep").addEventListener("click", () => addStep());

// ---------- назначение изображений ----------
let dragImgs = [];
function assignImages(nodeId, ids, index) {
  const n = find(nodeId); if (!n) return; const list = ids.filter(id => IMG.has(id));
  for (const id of list) { const owner = ownerOf(id); if (owner && owner !== n) owner.images.splice(owner.images.indexOf(id), 1); const pi = P.pool.indexOf(id); if (pi >= 0) P.pool.splice(pi, 1); const cur = n.images.indexOf(id); if (cur >= 0) n.images.splice(cur, 1); }
  if (index == null || index > n.images.length) n.images.push(...list); else n.images.splice(index, 0, ...list);
  poolSel.clear(); commit(); renderAll(); save(true); toast(`В «${n.title}»: ${list.length} изображений`);
}
function ownerOf(imgId) { let r = null; walk(P.nodes, n => { if (n.images.includes(imgId)) r = n; }); return r; }
function unassign(nodeId, imgId) { const n = find(nodeId); n.images.splice(n.images.indexOf(imgId), 1); P.pool.push(imgId); commit(); renderAll(); save(true); }
function thumbEl(id, opts = {}) {
  const r = IMG.get(id); const el = document.createElement("div"); el.className = "thumb" + (poolSel.has(id) && opts.pool ? " sel" : ""); el.dataset.id = id; el.draggable = true;
  el.innerHTML = `<img alt=""><div class="cap"></div>${opts.index != null ? `<span class="badge">${opts.index + 1}</span>` : ""}<button class="x" title="${opts.pool ? "Удалить из проекта" : "Вернуть в пул"}">×</button>`;
  el.querySelector("img").src = r.thumbUrl; el.querySelector(".cap").textContent = r.name; el.title = `${r.name} · ${r.w}×${r.h}`;
  el.addEventListener("dragstart", e => { dragImgs = opts.pool && poolSel.has(id) ? [...poolSel] : [id]; dragImgs.src = opts.node || null; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", id); });
  el.addEventListener("dragend", () => { el.classList.remove("dragging"); setTimeout(() => dragImgs = [], 50); });
  el.querySelector(".x").addEventListener("click", e => { e.stopPropagation(); if (opts.pool) removeImage(id); else unassign(opts.node, id); });
  el.addEventListener("dblclick", () => window.open(r.url, "_blank"));
  el.addEventListener("contextmenu", e => { e.preventDefault(); e.stopPropagation(); openMenu(e.clientX, e.clientY, [
    { h: r.name }, { t: "Открыть оригинал", f: () => window.open(r.url, "_blank") },
    { t: "Заменить файлом…", f: () => { replaceTarget = id; $("fileReplace").click(); } },
    opts.pool ? null : { t: "Вернуть в пул", f: () => unassign(opts.node, id) },
    { t: "Удалить из проекта", danger: true, f: () => removeImageAnywhere(id) },
  ].filter(Boolean)); });
  return el;
}
let replaceTarget = null;
$("fileReplace").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; const id = replaceTarget; replaceTarget = null; if (!f || !id || !IMG.has(id)) return;
  try { const buf = await f.arrayBuffer(); const { im, url } = await decode(f); URL.revokeObjectURL(url); const thumb = await makeThumb(im); const old = IMG.get(id);
    if (DESKTOP && old && old.ext !== extOf(f, f.name)) await desktop.deleteImage(id, old.ext).catch(() => {});
    await storePut(id, { blob: f, thumb, w: im.naturalWidth, h: im.naturalHeight, name: f.name, hash: await sha256(buf), size: f.size }); renderAll(); save(true); toast("Изображение заменено: " + f.name); }
  catch (err) { toast("Замена: " + (err.message || err), true); }
});
async function removeImageAnywhere(id) { const r = IMG.get(id); if (!await confirmDlg("Удалить изображение?", `${r.name} будет удалено из проекта и из шагов.`)) return; walk(P.nodes, n => { const i = n.images.indexOf(id); if (i >= 0) n.images.splice(i, 1); }); const pi = P.pool.indexOf(id); if (pi >= 0) P.pool.splice(pi, 1); poolSel.delete(id); commit(); await gcImages(); renderAll(); save(true); }
async function removeImage(id) { const r = IMG.get(id); if (!await confirmDlg("Удалить изображение?", `${r.name} будет удалено из проекта.`)) return; P.pool.splice(P.pool.indexOf(id), 1); poolSel.delete(id); commit(); await gcImages(); renderAll(); save(true); }
function renderPool() {
  const pool = $("pool"); pool.innerHTML = ""; const list = P.pool.slice().sort((a, b) => natural.compare(IMG.get(a)?.name || "", IMG.get(b)?.name || ""));
  P.pool = list.filter(id => IMG.has(id));
  if (!P.pool.length) pool.innerHTML = `<div class="empty" style="grid-column:1/-1;color:var(--muted);padding:10px 4px;line-height:1.5;font-size:13px;">Все изображения распределены. Добавьте новые кнопкой «+ Изображения» или перетащите файлы в окно.</div>`;
  for (const id of P.pool) { const el = thumbEl(id, { pool: true }); el.addEventListener("click", e => { if (e.shiftKey && lastPoolClick) { const a = P.pool.indexOf(lastPoolClick), b = P.pool.indexOf(id); P.pool.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => poolSel.add(x)); } else if (poolSel.has(id)) poolSel.delete(id); else poolSel.add(id); lastPoolClick = id; renderPool(); }); pool.appendChild(el); }
  $("poolCount").textContent = `· ${P.pool.length}` + (poolSel.size ? ` · выбрано ${poolSel.size}` : "");
  $("bAssign").disabled = !(selId && poolSel.size); $("bSelAll").textContent = poolSel.size === P.pool.length && P.pool.length ? "Снять выбор" : "Выбрать все";
}
let lastPoolClick = null;
$("bSelAll").addEventListener("click", () => { if (poolSel.size === P.pool.length) poolSel.clear(); else P.pool.forEach(id => poolSel.add(id)); renderPool(); });
$("bAssign").addEventListener("click", () => { if (!selId) return; let target = find(selId); if (target.type === "section") { target = addStep(target.id); } assignImages(target.id, [...poolSel]); });
$("bAutoSplit").addEventListener("click", () => {
  if (!P.pool.length) { toast("Пул пуст", true); return; } let sec = selId && find(selId); if (sec && sec.type === "step") sec = parentOf(sec.id); if (!sec) { sec = node("section", "Раздел " + (P.nodes.length + 1)); P.nodes.push(sec); }
  const ids = P.pool.slice(); let k = sec.children.filter(c => c.type === "step").length;
  for (const id of ids) { const st = node("step", "Шаг " + (++k)); st.images.push(id); sec.children.push(st); }
  P.pool = []; commit(); selectNode(sec.id); renderAll(); save(true); toast(`Создано шагов: ${ids.length}`);
});

        <div class="hintline"><a href="#" id="insLink" style="color:var(--accent)">Вставить ссылку на раздел…</a> · внутренние ссылки записываются как <span class="kbd">[[адрес|текст]]</span></div></div>
      <label class="check"><input type="checkbox" id="fWarn"> Важное предупреждение (выделить на странице)</label>

    try { const st = await desktop.state(); if (st.projectDir) await desktopOpenPath(st.projectDir); else showStart(); } catch (e) { toast("Хранилище недоступно: " + (e.message || e), true); showStart(); }
    return;
  }
  try {
    const saved = await kvGet("project"); P = saved && saved.nodes ? saved : newProject(); P.pool ||= []; P.images ||= {}; walk(P.nodes, n => { n.children ||= []; n.images ||= []; });
    const all = await imgAll(); for (const [id, rec] of all) { attachWeb(id, rec); const r = IMG.get(id); P.images[id] = { name: r.name, w: r.w, h: r.h, hash: r.hash, size: r.size, ext: r.ext }; }
    const known = new Set(IMG.keys()); P.pool = P.pool.filter(id => known.has(id)); walk(P.nodes, n => n.images = n.images.filter(id => known.has(id)));
  } catch (e) { P = newProject(); toast("Хранилище недоступно, изменения не сохранятся: " + (e.message || e), true); }
  lastSnap = snapshot(); updateHistoryButtons(); renderAll();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
